<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Aston Villa vs Tottenham</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-image: url("villa-park.jpg");
      background-size: cover;
      background-position: top;
      background-repeat: no-repeat;
      
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      color: white;
    }
    
    .match-line {
      display: flex;
      align-items: center;
      gap: 60px;
      margin-bottom: 2rem;
    }
    
    .match-line img {
      width: 180px;
      height: 325px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    
    .vs {
      font-size: 6rem;
      font-weight: 900;
      color: #FFD700;
      text-shadow: 3px 3px 6px black;
    }
    
    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin: 0.5rem 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    
    h2 {
      font-size: 2rem;
      font-weight: 500;
      margin: 0.25rem 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    h3 {
      font-size: 1rem;
      font-weight: 500;
      margin-top: 50px;
      margin: 0.25rem 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div class="match-line">
    <img src="logo-svg.jpg" alt="Aston Villa">
    <span class="vs">VS</span>
    <img src="Tottenham-Hotspur-Logo-2006-2013.jpg" alt="Tottenham">
  </div>
  
  <h1>Saturday 2 May</h1>
  <h2>Villa Park</h2>
  <h3>I wanted to know if you're OK. The tickets go on sale in March but I need to buy my plane ticket now, and if we don't get tickets for the game we're going to stay in Milton Keynes. </h3>
</body>
</html>
