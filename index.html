<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday dad</title>
  <link rel="stylesheet" href="style.css">
  <style>
    h1 {
      /* GROS TITRE */
      font-size: 4rem;    
      font-weight: 800;    /* gras */
      margin-bottom: 1rem;
      margin-left: 500px;
      margin-top: 220px;
      
      /* COULEUR JAUNE OR */
      color: #FFD700;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.8); /* ombre noire */
      
      /* Effet brillant */
      text-shadow: 
        0 0 10px #FFD700,
        3px 3px 6px rgba(0,0,0,0.8);
    }
    /* BOUTON SON COULEUR DORÉE */
    .music-btn {
      font-size: 1.5rem; 
      padding: 20px 40px; 
      background: linear-gradient(45deg, #FFD700, #FFA500, #FF6B35);
      color: #1a1a1a;
      border: 4px solid #FFED4A;
      border-radius: 50px; 
      cursor: pointer; 
      box-shadow: 0 10px 30px rgba(255,215,0,0.5);
      transition: all 0.3s;
      font-weight: bold;
      text-shadow: none;
    }
    .music-btn:hover { 
      transform: scale(1.1); 
      box-shadow: 0 15px 40px rgba(255,215,0,0.7);
      background: linear-gradient(45deg, #FFA500, #FF6B35, #FFD700);
    }
    .music-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <h1>Happy Birthday</h1>
  <h2 margin-left: 500px;>click the present to open it</h2>
  <a href="kdo">
 <img src="christmas-gift-box-ai-generated-free-photo.jpeg" alt="cadeau" style="
    width: 250px; height: auto;
    border: 5px solid gold;
    border-radius: 20px;
    margin-top: 30px;
   margin-left: 500px;
  "></a>
 <audio controls style="margin-top: 30px; width: 300px;">
  <source src="saavane-happy-birthday-254480.mp3" type="audio/mpeg">
  </audio>
    
</body>
</html>
