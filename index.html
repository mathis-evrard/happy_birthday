<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday dad</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      /* CENTRE TOUT AUTOMATIQUE */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
      margin: 0; /* enlève les marges par défaut */
    }
    
    h1 {
      font-size: 4rem;    
      font-weight: 800;
      /* SUPPRIME margin-left/top, flex centre tout */
      
      color: #FFD700;
      text-shadow: 0 0 10px #FFD700, 3px 3px 6px rgba(0,0,0,0.8);
      margin-bottom: 1rem;
    }
    
    h2 {
      color: red;
      font-size: 1.3rem;
      margin: 1rem 0;
    }
    
    /* AUDIO */
    audio { 
      width: 300px; 
      margin: 1rem 0;
      filter: drop-shadow(0 5px 15px rgba(255,215,0,0.5));
    }
    
    /* IMAGE */
    img {
      width: 250px; 
      height: auto;
      border: 5px solid gold;
      border-radius: 20px;
      margin-top: 30px;
      cursor: pointer;
      transition: transform 0.3s;
    }
    img:hover { transform: scale(1.05); }
    
    /* BOUTON */
    .music-btn {
      font-size: 1.5rem; padding: 20px 40px; 
      background: linear-gradient(45deg, #FFD700, #FFA500, #FF6B35);
      color: #1a1a1a; border: 4px solid #FFED4A;
      border-radius: 50px; cursor: pointer; 
      box-shadow: 0 10px 30px rgba(255,215,0,0.5);
      transition: all 0.3s; font-weight: bold;
    }
    .music-btn:hover { transform: scale(1.1); }
  </style>
</head>
<body>
  <h1>Happy Birthday</h1>
  
  <!-- AUDIO CORRIGÉ -->
  <audio controls style="width: 300px;">
    <source src="saavane-happy-birthday-254480.mp3" type="audio/mpeg">
    Navigateur non supporté.
  </audio>
  
  <h2>Click the present to open it</h2>
  
  <!-- LIEN CORRIGÉ -->
  <a href="kdo.html">
    <img src="christmas-gift-box-ai-generated-free-photo.jpeg" alt="Cadeau">
  </a>
</body>
</html>
